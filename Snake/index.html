<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Simple Snake Game</title>
    <link rel="stylesheet" href="style.css" />
    <!--CSS Styles-->
  </head>
  <body>
    <canvas id="sC"></canvas>
    <div class="mCt">
      <h1>A Simple Snake Game</h1>
      <!--Title-->
      <p>Score: <span id="score"> </span></p>
      <!--Score-->
      <p>Best today: <span id="best"></span></p>
      <!-- Best -->
      <div class="cP">
        <label for="slider">Game Speed:</label>
        <input
          type="range"
          id="slider"
          min="2"
          max="15"
          value="6"
          step="1"
        />
        <span id="value">6</span>
      </div>
      <!-- Sliders -->
      <canvas width="400" height="400" id="game"> </canvas>
      <!--Canvas-->
    </div>
    <!-- Wrapping all active UI element so they layer on top -->
    <script src="script.js"></script>
    <!--JS Script-->
  </body>
</html>
